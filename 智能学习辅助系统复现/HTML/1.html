<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能学习辅助系统</title>
  <link rel="stylesheet" href="../css/up_list.css">
  <link rel="stylesheet" href="../css/table.css">
</head>
<style>
  #log_out{
    text-decoration: none;
    color: white;
  }
  .title{
    /* 弹性布局 */
    display: flex;
    justify-content: space-between;
    align-items: center;
    /* 背景颜色 */
    background-color: #ababab;
    /* 整体布局 */
    padding: 10px 20px;
    margin: 0 250px;
    height: 50px;
    }
</style>
<body>
  <div class="title">
    <h1 style="color: white;font-family: 'KaiTi';">tlias 智能学习辅助系统</h1>
    <a id="log_out" href="login.html">退出登录</a>
  </div>
  <div id="app">
    <!-- 定义一个表单 -->
    <form action="2.html" method="post">
      <div class="element_left">
        姓名 &nbsp; <input type="text" v-model="searchForm.name" name="name">
        &nbsp;
        &nbsp;
        性别 &nbsp; 
        <select v-model="searchForm.gender" name="gender">
          <option value="" disabled selected  style="display:none"></option>
          <option value="1">男</option>
          <option value="2">女</option>
        </select>
        &nbsp;
        &nbsp;
        职位 &nbsp; 
        <select v-model="searchForm.job" name="job">
          <option value="" disabled selected style="display:none"></option>
          <option value="1">班主任</option>
          <option value="2">讲师</option>
          <option value="3">学工主管</option>
          <option value="4">教研主管</option>
          <option value="5">咨询师</option>
        </select>
      </div>
      <div class="element_right">
        <button type="button" @click="search">查询</button>
        <button type="button" @click="clear">清空</button>
      </div>
    </form>
    <!-- 定义一个表格 -->
    <table>
      <thead>
        <tr>
          <th>姓名</th>
          <th>性别</th>
          <th>头像</th>
          <th>所属部门</th>
          <th>职位</th>
          <th>入职日期</th>
          <th>最后操作时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(e,index) in empList" :key="e.id">
          <td>{{e.name}}</td>
          <td>
            <span v-if="e.gender == 1">男</span>
            <span v-else>女</span>
          </td>
          <td><img v-bind:src="e.image"></td>
          <td>{{e.department}}</td>
          <td>{{e.position}}</td>
          <td>{{e.startDate}}</td>
          <td>{{e.endDate}}</td>
          <td>
            <button>编辑</button>
            <button>删除</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
